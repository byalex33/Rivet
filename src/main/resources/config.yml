# Settings shared across Rivet modules. Feature switches live in modules.yml;
# module options live in settings/; saved runtime data lives in data/.
# Internal one-time migration marker for Rivet's white and #f72a4c message palette.
message-palette-version: 1
# Internal configuration migration version.
configuration-version: 2
messages:
  # Shared MiniMessage tag used by tagged Rivet modules.
  tag: "<#f72a4c><bold>RIVET</bold></#f72a4c> <dark_gray>›</dark_gray>"
effects:
  # Show title feedback for supported commands.
  titles: true
  # Play feedback sounds across modules.
  sounds: true
  # Show feedback particles across modules.
  particles: true
