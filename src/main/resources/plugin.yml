name: Rivet
version: '1.0-SNAPSHOT'
main: dev.rivet.RivetPlugin
api-version: '1.21.11'
description: Everything your Paper server needs, held together
commands:
  gmc:
    description: Switch to creative mode
    permission: rivet.gamemode
  gms:
    description: Switch to survival mode
    permission: rivet.gamemode
  flat:
    description: Create or teleport to the flat test world
    permission: rivet.flat
  flatworld:
    description: Manage flat testing worlds
    usage: /flatworld <create|tp|reset|list> [name]
    permission: rivet.world
  voidworld:
    description: Create void testing worlds
    usage: /voidworld create <name>
    permission: rivet.world
  worldspawn:
    description: Teleport to the current world's spawn
    permission: rivet.world
  setworldspawn:
    description: Set the current world's spawn
    permission: rivet.world
  sethome:
    description: Set your home
    usage: /sethome [name]
    permission: rivet.home
  home:
    description: Teleport home
    usage: /home [name]
    permission: rivet.home
  delhome:
    description: Delete a home
    usage: /delhome [name]
    permission: rivet.home
  setwarp:
    description: Set a public warp
    usage: /setwarp <name>
    permission: rivet.warp.set
  warp:
    description: Teleport to a public warp
    usage: /warp <name>
    permission: rivet.warp
  delwarp:
    description: Delete a public warp
    usage: /delwarp <name>
    permission: rivet.warp.set
  clear:
    description: Clear all or selected items from an inventory
    usage: /clear [player] [item[:amount][;plain]] [-s]
    permission: rivet.inventory
  i:
    description: Give yourself an item
    usage: /i <item> [amount]
    permission: rivet.inventory
  condense:
    description: Condense plain materials into storage blocks
    permission: rivet.condense
  donate:
    description: Donate held items to an online player
    usage: /donate <player> [amount]
    permission: rivet.donate
  giveall:
    description: Give an item to every online player
    usage: /giveall <item> [amount]
    permission: rivet.giveall
  scan:
    description: Scan saved world containers for an item
    usage: /scan <item> [world|all]
    permission: rivet.inventory.scan
  givebreeder:
    aliases: [giveautobreeder]
    description: Give an animal-specific auto breeder
    usage: /givebreeder <animal> [amount] or /givebreeder <player> <animal> [amount]
    permission: rivet.givebreeder
  restorationcore:
    aliases: [givecore]
    description: Give one or more throwable Restoration Cores
    usage: /restorationcore [player] [amount]
    permission: rivet.restorationcore.give
  killall:
    description: Remove all mobs from the current world
    permission: rivet.world
  day:
    description: Fast-forward the current world to day
    permission: rivet.environment
  night:
    description: Fast-forward the current world to night
    permission: rivet.environment
  noon:
    description: Set the current world to noon
    permission: rivet.environment
  midnight:
    description: Set the current world to midnight
    permission: rivet.environment
  sun:
    description: Clear the current world's weather
    permission: rivet.environment
  rain:
    description: Start rain in the current world
    permission: rivet.environment
  thunder:
    description: Start a thunderstorm in the current world
    permission: rivet.environment
  msg:
    description: Privately message a player
    usage: /msg <player> <message>
    permission: rivet.message
  r:
    description: Reply to your last private message
    usage: /r <message>
    permission: rivet.message
  socialspy:
    aliases: [ss]
    description: Toggle private-message social spy
    permission: rivet.socialspy
  ignore:
    description: Manage ignored private-message senders
    usage: /ignore <player|list|clear>
    permission: rivet.ignore
  chatcolor:
    description: Choose a persistent chat style
    usage: /chatcolor [player] <color|#hex|gradient start end|rainbow|reset>
    permission: rivet.chatcolor
  tag:
    description: Choose a cosmetic chat tag
    usage: /tag <set [player] tag|reset [player]|list>
    permission: rivet.chat.tag
  tp:
    description: Teleport to a player
    usage: /tp <player>
    permission: rivet.teleport
  tppos:
    description: Teleport to coordinates in the current world
    usage: /tppos <x> <y> <z>
    permission: rivet.tppos
  vanish:
    aliases: [v]
    description: Toggle staff vanish
    permission: rivet.vanish
  fly:
    description: Toggle flight
    usage: /fly
    permission: rivet.fly
  flyspeed:
    description: Set your or another player's flight speed
    usage: /flyspeed [player] <amount>
    permission: rivet.flyspeed
  commandspy:
    aliases: [cspy]
    description: Toggle staff command monitoring
    permission: rivet.commandspy
  heal:
    description: Restore health for yourself or another player
    usage: /heal [player]
    permission: rivet.heal
  feed:
    description: Restore hunger for yourself or another player
    usage: /feed [player]
    permission: rivet.feed
  god:
    description: Toggle invulnerability for yourself or another player
    usage: /god [player] [true|false] [-s]
    permission: rivet.god
  bossbarmsg:
    description: Show a timed MiniMessage boss bar
    usage: /bossbarmsg <player|all> [flags] <message>
    permission: rivet.bossbarmsg
  perm:
    description: Manage Rivet users, groups, inheritance, and permissions
    usage: /perm <user|group|check|tree|listgroups|reload>
    permission: rivet.permissions.manage
  hologram:
    aliases: [holo]
    description: Manage holograms
    usage: /hologram help
    permission: rivet.holograms
  clearhologram:
    description: Clear stale auto-breeder holograms without changing /holo displays
    permission: rivet.clearhologram
  spawn:
    description: Teleport to the server spawn
    permission: rivet.spawn
  setspawn:
    description: Set the server spawn
    permission: rivet.spawn.set
  tpa:
    description: Request to teleport to a player
    usage: /tpa <player>
    permission: rivet.tpa
  tpahere:
    description: Request that a player teleports to you
    usage: /tpahere <player>
    permission: rivet.tpa
  tpaccept:
    description: Accept a teleport request
    usage: /tpaccept [player]
    permission: rivet.tpa
  tpdeny:
    description: Deny a teleport request
    usage: /tpdeny [player]
    permission: rivet.tpa
  kit:
    description: List or receive a configured kit
    usage: /kit [name]
    permission: rivet.kit
  back:
    description: Return to your most recent useful location
    permission: rivet.back
  afk:
    description: Toggle AFK status with an optional reason
    usage: /afk [reason] [-p:player] [-s]
    permission: rivet.afk
  afkcheck:
    description: Inspect online AFK status and duration
    usage: /afkcheck [player|all]
    permission: rivet.afkcheck
  invsee:
    description: Open an online player's inventory
    usage: /invsee <player>
    permission: rivet.inventory.invsee
  enderchest:
    aliases: [ec]
    description: Open your or another online player's ender chest
    usage: /enderchest [player]
    permission: rivet.inventory.enderchest
  repair:
    description: Repair a held item or all carried equipment
    usage: /repair [all]
    permission: rivet.repair
  rename:
    description: Rename the held item
    usage: /rename <name|clear>
    permission: rivet.rename
  lore:
    description: Edit lore on the held item
    usage: /lore <add|set|remove|clear>
    permission: rivet.lore
  nick:
    description: Set or remove a nickname
    usage: /nick <nickname|off>
    permission: rivet.nick
  stats:
    description: Show player statistics
    usage: /stats [player]
    permission: rivet.stats
  trash:
    description: Open a disposable item inventory
    permission: rivet.trash
  craft:
    description: Open a portable crafting table
    permission: rivet.utility.craft
  anvil:
    description: Open a portable anvil
    permission: rivet.utility.anvil
  smithing:
    description: Open a portable smithing table
    permission: rivet.utility.smithing
  stonecutter:
    description: Open a portable stonecutter
    permission: rivet.utility.stonecutter
  grindstone:
    description: Open a portable grindstone
    permission: rivet.utility.grindstone
  sit:
    description: Toggle a sitting pose
    permission: rivet.pose.sit
  lay:
    description: Toggle a laying pose
    permission: rivet.pose.lay
  crawl:
    description: Toggle a crawling pose
    permission: rivet.pose.crawl
  head:
    description: Give yourself a cached player's head
    usage: /head <player>
    permission: rivet.head
  backpack:
    aliases: [bp]
    description: Open your persistent personal backpack
    permission: rivet.backpack
  daily:
    description: Claim your daily reward
    permission: rivet.daily
  rtp:
    description: Teleport to a safe random location
    usage: /rtp [world]
    permission: rivet.rtp
  near:
    description: List nearby visible players
    permission: rivet.near
  findbiome:
    description: Find the nearest matching biome
    usage: /findbiome <biome>
    permission: rivet.findbiome
  filter:
    description: Manage your persistent item pickup filter
    usage: /filter [add|remove|list|clear|toggle|help]
    permission: rivet.filter
  magnet:
    description: Toggle automatic nearby item collection
    usage: /magnet
    permission: rivet.magnet
  poll:
    description: Open the polls GUI or create a yes/no poll
    usage: /poll or /poll create <name> <description>
    permission: rivet.poll
  hat:
    description: Wear the item in your main hand
    permission: rivet.hat
  jump:
    description: Teleport safely to the block you are looking at
    permission: rivet.jump
  list:
    description: List visible online players
    permission: rivet.list
  me:
    description: Broadcast an action message
    usage: /me <message>
    permission: rivet.me
  note:
    description: Manage UUID-keyed staff notes
    usage: /note <player> <add|remove|clear|list>
    permission: rivet.notes
  ping:
    description: Show network latency
    usage: /ping [player]
    permission: rivet.ping
  playtime:
    description: Show native player playtime
    usage: /playtime [player]
    permission: rivet.playtime
  seen:
    description: Show a player's join, login, logout, and playtime summary
    usage: /seen <player>
    permission: rivet.seen
  nv:
    description: Toggle infinite night vision
    usage: /nv
    permission: rivet.nv
  snapshot:
    description: Browse, search, create and restore inventory backups
    usage: /snapshot <view <player>|save <player>|saveall|search <item>|cleanup>
  ride:
    description: Ride the entity you are looking at
    permission: rivet.ride
  sameip:
    description: Find visible online players sharing a session address
    usage: /sameip [player]
    permission: rivet.sameip
  toast:
    description: Show a temporary advancement toast
    usage: /toast <player|all> i:<icon> t:<title> <message> [type:<type>]
    permission: rivet.toast
  top:
    description: Teleport to the highest safe location
    usage: /top [player]
    permission: rivet.top
  tree:
    description: Generate a vanilla tree at the targeted block
    usage: /tree <treeType>
    permission: rivet.tree
  help:
    aliases: [rivethelp, rhelp]
    description: Browse the commands available to you
    usage: /help [page]
    permission: rivet.help
  lagg:
    description: Clear eligible dropped items or view the cleanup timer
    usage: /lagg <clear|timer>
    permission: rivet.lagg
  log:
    aliases: [logs]
    description: Inspect and search the gameplay audit log
    usage: /log <inspect|lookup|page|reload>
  rivet:
    description: Show Rivet information or reload configuration
    usage: /rivet [reload]
    permission: rivet.admin
