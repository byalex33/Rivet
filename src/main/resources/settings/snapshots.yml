# Inventory backups use plugins/Rivet/snapshots.db, not YAML runtime data.
# Existing Rivet snapshot rows remain compatible with this workflow.
retention-days: 14
deduplicate: true

# Show an ALL category before the individual backup categories.
enable-all-category: true

automatic-backup:
  enabled: true
  seconds: 180

# Event categories can be disabled independently. Container close saves the player's
# inventory at the time they close a chest, barrel, shulker, hopper, dispenser or dropper.
enabled-backups:
  ender-chest: true
  death: true
  join: true
  quit: true
  world-change: true
  gamemode-change: true
  container-close: true
  manual: true
  automatic: true

# Maximum backups per player in each category. -1 means unlimited.
save-limits:
  ender-chest: -1
  death: -1
  join: -1
  quit: -1
  world-change: -1
  gamemode-change: -1
  container-close: -1
  manual: -1
  automatic: -1
  total: -1

search:
  maximum-matches: 1000
  timeout-seconds: 60

restore:
  create-safety-snapshot: true
  require-confirmation: true

audit:
  # Records only snapshot metadata in logs.db when the logs module is available.
  record-creations: true

# DeluxeMenus-style GUI schema. Slots are zero-based. Category and list sizes
# may be changed; preview screens remain 54 slots so saved inventories stay exact.
gui:
  categories:
    menu_title: "<#f72a4c><bold>RIVET</bold></#f72a4c> <dark_gray>•</dark_gray> <white>Restore &gt; %player%</white>"
    size: 54
    open_commands: []
    items:
      filler: { material: GRAY_STAINED_GLASS_PANE, slots: [0-9, 17-18, 26-27, 35-36, 44-53], display_name: '' }
      category: { material: '%material%', slots: [10-16, 19-25, 28-34, 37-43] }
      previous-page: { material: ARROW, slot: 45, display_name: '<white>Previous page</white>' }
      page-info: { material: BOOK, slot: 49, display_name: '<white>Page %page%/%pages%</white>', lore: ['<gray>%count% categories</gray>'] }
      next-page: { material: ARROW, slot: 53, display_name: '<white>Next page</white>' }
  list:
    menu_title: "<#f72a4c><bold>RIVET</bold></#f72a4c> <dark_gray>•</dark_gray> <white>Restore &gt; %name%</white>"
    size: 54
    open_commands: []
    items:
      filler: { material: GRAY_STAINED_GLASS_PANE, slots: [0-9, 17-18, 26-27, 35-36, 44-53], display_name: '' }
      snapshot: { material: '%material%', slots: [10-16, 19-25, 28-34, 37-43] }
      previous-page: { material: ARROW, slot: 45, display_name: '<white>Previous page</white>' }
      back: { material: BARRIER, slot: 49, display_name: '<red>Back to categories</red>', lore: ['<gray>Page %page%/%pages%</gray>', '<gray>%count% backups</gray>'] }
      next-page: { material: ARROW, slot: 53, display_name: '<white>Next page</white>' }
  player-preview:
    menu_title: "<#f72a4c><bold>RIVET</bold></#f72a4c> <dark_gray>•</dark_gray> <white>Restore &gt; %player%</white>"
    size: 54
    open_commands: []
    items:
      filler: { material: BLACK_STAINED_GLASS_PANE, slots: 36-43, display_name: '' }
      export: { material: SHULKER_BOX, slot: 44, display_name: '<white>Export as shulker boxes</white>' }
      back: { material: BARRIER, slot: 50, display_name: '<white>Back</white>' }
      details: { material: COMPASS, slot: 51 }
      teleport: { material: ENDER_PEARL, slot: 52, display_name: '<white>Teleport to location</white>' }
      restore: { material: PISTON, slot: 53, display_name: '<white>Replace player inventory</white>' }
  ender-preview:
    menu_title: "<#f72a4c><bold>RIVET</bold></#f72a4c> <dark_gray>•</dark_gray> <white>Restore &gt; %player%</white>"
    size: 54
    open_commands: []
    items:
      filler: { material: BLACK_STAINED_GLASS_PANE, slots: 27-53, display_name: '' }
      back: { material: BARRIER, slot: 45, display_name: '<white>Back</white>' }
      details: { material: COMPASS, slot: 47 }
      teleport: { material: ENDER_PEARL, slot: 49, display_name: '<white>Teleport to location</white>' }
      export: { material: SHULKER_BOX, slot: 51, display_name: '<white>Export as shulker boxes</white>' }
      restore: { material: ENDER_CHEST, slot: 53, display_name: '<white>Replace ender chest</white>' }
  confirm:
    menu_title: "<#f72a4c><bold>RIVET</bold></#f72a4c> <dark_gray>•</dark_gray> <white>Confirm Restore</white>"
    size: 27
    open_commands: []
    items:
      filler: { material: GRAY_STAINED_GLASS_PANE, slots: 0-26, display_name: '' }
      cancel: { material: RED_CONCRETE, slot: 11, display_name: '<red><bold>Cancel</bold></red>', lore: ['<gray>Return without changing anything</gray>'] }
      warning: { material: PAPER, slot: 13, display_name: '<yellow>This replaces current items</yellow>' }
      confirm: { material: LIME_CONCRETE, slot: 15, display_name: '<green><bold>Confirm restore</bold></green>' }

# MiniMessage and the shared %tag% component are supported.
messages:
  denied: { enabled: true, actions: ['[message] <white>%tag% You do not have permission to do that.</white>'] }
  denied-others: { enabled: true, actions: ["[message] <white>%tag% You cannot view another player's backups.</white>"] }
  denied-restore: { enabled: true, actions: ['[message] <white>%tag% You do not have permission to restore backups.</white>'] }
  denied-teleport: { enabled: true, actions: ['[message] <white>%tag% You do not have permission to teleport to backups.</white>'] }
  denied-export: { enabled: true, actions: ['[message] <white>%tag% You do not have permission to export backups.</white>'] }
  player-only: { enabled: true, actions: ['[message] <white>%tag% This command is only available to players.</white>'] }
  usage: { enabled: true, actions: ['[message] <white>%tag% Usage: /snapshot &lt;view &lt;player&gt;|save &lt;player&gt;|saveall|search &lt;item&gt;|cleanup&gt;</white>'] }
  loading: { enabled: true, actions: ['[message] <white>%tag% Loading backups...</white>'] }
  not-found: { enabled: true, actions: ['[message] <white>%tag% That player could not be found.</white>'] }
  none: { enabled: true, actions: ['[message] <white>%tag% No backups were found for <#f72a4c>%player%</#f72a4c>.</white>'] }
  load-failed: { enabled: true, actions: ['[message] <white>%tag% Backups could not be loaded. Check the console.</white>'] }
  target-offline: { enabled: true, actions: ['[message] <white>%tag% The target player must be online and visible.</white>'] }
  empty: { enabled: true, actions: ['[message] <white>%tag% No backup was made because that inventory is empty or excluded.</white>'] }
  manual-backup: { enabled: true, actions: ['[message] <white>%tag% Created a manual backup for <#f72a4c>%player%</#f72a4c>.</white>'] }
  manual-backup-all: { enabled: true, actions: ['[message] <white>%tag% Created manual backups for <#f72a4c>%count%</#f72a4c> players.</white>'] }
  searching: { enabled: true, actions: ['[message] <white>%tag% Searching inventory backups for <#f72a4c>%query%</#f72a4c>...</white>'] }
  search-none: { enabled: true, actions: ['[message] <white>%tag% No backups contained <#f72a4c>%query%</#f72a4c>.</white>'] }
  cleaned-up: { enabled: true, actions: ['[message] <white>%tag% Removed <#f72a4c>%count%</#f72a4c> old backups.</white>'] }
  cleanup-failed: { enabled: true, actions: ['[message] <white>%tag% Backup cleanup failed. Check the console.</white>'] }
  busy: { enabled: true, actions: ['[message] <white>%tag% A restore is already running for that player.</white>'] }
  safety-failed: { enabled: true, actions: ['[message] <white>%tag% The safety backup failed, so nothing was restored.</white>'] }
  restored: { enabled: true, actions: ['[message] <white>%tag% Restored backup <#f72a4c>#%id%</#f72a4c> to <#f72a4c>%player%</#f72a4c>.</white>'] }
  restored-target: { enabled: true, actions: ['[message] <white>%tag% Your items were restored from backup <#f72a4c>#%id%</#f72a4c>.</white>'] }
  restore-failed: { enabled: true, actions: ['[message] <white>%tag% The backup could not be restored. Check the console.</white>'] }
  world-unavailable: { enabled: true, actions: ['[message] <white>%tag% The backup world is not loaded.</white>'] }
  export-space: { enabled: true, actions: ['[message] <white>%tag% You need <#f72a4c>%slots%</#f72a4c> empty inventory slots.</white>'] }
  exported: { enabled: true, actions: ['[message] <white>%tag% Exported backup <#f72a4c>#%id%</#f72a4c> into <#f72a4c>%count%</#f72a4c> inventory slots.</white>'] }
