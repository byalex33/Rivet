# Adds a safe reroll entry to the normal villager trading screen.
permission: rivet.villager-reroll

# Vanilla locks a villager's profession and offers after the first trade. Keep this
# false to protect traded villagers. Enabling it deliberately allows all offers at
# the villager's current level to be regenerated.
allow-after-trading: false

# Require the villager to remember a job-site block, matching normal workstation
# rerolling and preventing professions from being rerolled away from their station.
require-workstation: true

trade:
  ingredient:
    material: EMERALD
    amount: 1
  result:
    material: NETHER_STAR
    name: '<#f72a4c><bold>↻ Reroll trades</bold></#f72a4c>'
    lore:
      - '<gray>Generate a fresh set of vanilla trades.</gray>'
      - ''
      - '<dark_gray>│</dark_gray> <#f72a4c>Right-click</#f72a4c> <gray>to reroll this villager.</gray>'
      - '<dark_gray>│ The emerald is not consumed.</dark_gray>'

messages:
  rerolled:
    enabled: true
    actions: ['[message] <white>Villager trades <#f72a4c>rerolled</#f72a4c>.</white>']
  trades-locked:
    enabled: true
    actions: ['[message] <white>This villager has already been traded with, so its trades are locked.</white>']
  no-workstation:
    enabled: true
    actions: ['[message] <white>This villager needs its workstation before its trades can be rerolled.</white>']
  busy:
    enabled: true
    actions: ['[message] <white>That villager is already rerolling its trades.</white>']
  no-permission:
    enabled: true
    actions: ['[message] <white>You do not have permission to reroll villager trades.</white>']
  failed:
    enabled: true
    actions: ["[message] <white>The villager's trades could not be rerolled.</white>"]

effects:
  sound:
    name: entity.villager.work_librarian
    volume: 0.8
    pitch: 1.2
