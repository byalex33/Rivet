join:
  enabled: true
  actions:
    - '[broadcast] <white>%player% joined the server.</white>'
leave:
  enabled: true
  actions:
    - '[broadcast] <white>%player% left the server.</white>'
first-join:
  enabled: true
  actions:
    - '[broadcast] <#f72a4c>Welcome <#f72a4c>%player%</#f72a4c> to the server for the first time!</#f72a4c>'

welcome-title:
  enabled: true
  actions:
    - '[title] <#f72a4c>Welcome, %player%!</#f72a4c> | <white>Enjoy your stay.</white> | 5 | 30 | 10'
welcome-chat:
  enabled: false
  actions:
    - '[message] <white>Welcome to the server, <#f72a4c>%player%</#f72a4c>!</white>'
motd:
  enabled: false
  actions:
    - '[message] <#f72a4c><bold>Server information</bold></#f72a4c>'
    - '[message] <white>Use <#f72a4c>/help</#f72a4c> to get started.</white>'
