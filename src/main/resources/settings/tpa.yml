request-expiry-seconds: 60
cooldown-seconds: 30
teleport-delay-seconds: 3
cancel-on-move: true

# Messages support MiniMessage and the placeholders used in each default.
messages:
  usage-request: "<red>Use /tpa <player> or /tpahere <player>.</red>"
  usage-answer: "<red>Use /tpaccept [player] or /tpdeny [player].</red>"
  sent: "<green>Teleport request sent to <white><player></white>.</green>"
  received: "<yellow><player> wants to teleport to you. Use <white>/tpaccept <player></white>.</yellow>"
  received-here: "<yellow><player> wants you to teleport to them. Use <white>/tpaccept <player></white>.</yellow>"
  accepted: "<green>Accepted <white><player></white>'s request.</green>"
  accepted-requester: "<green><player> accepted your teleport request.</green>"
  denied: "<yellow>Denied <white><player></white>'s request.</yellow>"
  denied-requester: "<red><player> denied your teleport request.</red>"
  expired: "<gray>Your teleport request to <white><player></white> expired.</gray>"
  multiple: "<yellow>You have multiple requests: <white><players></white>. Specify a player.</yellow>"
  none: "<red>No matching teleport request was found.</red>"
  self: "<red>You cannot send a teleport request to yourself.</red>"
  not-online: "<red>That player is not online.</red>"
  cooldown: "<red>Wait <seconds> seconds before sending another request.</red>"
  wait: "<yellow>Teleporting in <white><seconds></white> seconds. Do not move.</yellow>"
  cancelled: "<red>Teleport cancelled because you moved.</red>"
  teleported: "<green>Teleport complete.</green>"
