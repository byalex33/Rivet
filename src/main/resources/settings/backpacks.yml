# Personal persistent storage. Rows are clamped to the standard 1-6 range.
default-rows: 3
title: "<#f72a4c><bold>RIVET</bold></#f72a4c> <dark_gray>•</dark_gray> <white>Backpack</white>"

gui:
  open_commands:
    enabled: true
    actions: []

# World names are matched case-insensitively. Leave empty to allow every world.
blocked-worlds: []

messages:
  blocked-world:
    enabled: true
    actions:
      - '[message] <white>Backpacks are disabled in this world.</white>'
  overflow:
    enabled: true
    actions:
      - '[message] <white>Items above your current backpack size are safely retained until you regain more rows.</white>'
