# Personal persistent storage. Row permissions may increase the configured size.

gui:
  # DeluxeMenus-style schema. Slots are zero-based. Configured items reserve
  # their slots; any stored item behind a reserved slot remains safely saved.
  menu_title: "<#f72a4c><bold>RIVET</bold></#f72a4c> <dark_gray>•</dark_gray> <white>Backpack</white>"
  size: 27
  open_commands: []
  items: {}

# World names are matched case-insensitively. Leave empty to allow every world.
blocked-worlds: []

messages:
  blocked-world:
    enabled: true
    actions:
      - '[message] <white>Backpacks are disabled in this world.</white>'
  overflow:
    enabled: true
    actions:
      - '[message] <white>Items above your current backpack size are safely retained until you regain more rows.</white>'
