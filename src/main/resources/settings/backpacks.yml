# Personal persistent storage. Rows are clamped to the standard 1-6 range.
default-rows: 3
title: "<dark_gray>Backpack"

# World names are matched case-insensitively. Leave empty to allow every world.
blocked-worlds: []

messages:
  blocked-world: "<red>Backpacks are disabled in this world.</red>"
  overflow: "<yellow>Items above your current backpack size are safely retained until you regain more rows.</yellow>"
