join:
  # If both are false, joining never changes a player's location.
  teleport-every-join: false
  teleport-first-join: false

messages:
  set:
    enabled: true
    actions:
      - '[message] <white>Spawn set to your location.</white>'
  not-set:
    enabled: true
    actions:
      - '[message] <white>The server spawn has not been set.</white>'
  teleported:
    enabled: true
    actions:
      - '[message] <white>Teleported to spawn.</white>'
