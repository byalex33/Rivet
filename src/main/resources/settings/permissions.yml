# Rivet permission groups. Player assignments and direct grants are saved in
# ../data/permissions.yml.
groups:
  default:
    permissions:
      - rivet.message
  staff:
    parent: default
    permissions:
      - rivet.teleport
      - rivet.vanish
      - rivet.vanish.see
  admin:
    parent: staff
    permissions:
      - "*"
