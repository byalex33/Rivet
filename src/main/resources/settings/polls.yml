# Delay before reminding a joining player about polls they have not answered.
reminder-delay-ticks: 40

# Supports %yes% and %no% for the poll currently being rendered.
result-format: '<dark_gray>Yes: %yes%  •  No: %no%</dark_gray>'

# DeluxeMenus-style GUI schema. Slots are zero-based.
# Poll items and the vote menu also support %yes% and %no% alongside their existing placeholders.
gui:
  list:
    menu_title: "<#f72a4c><bold>RIVET</bold></#f72a4c> <dark_gray>•</dark_gray> <white>Polls</white>"
    size: 54
    open_commands: []
    items:
      filler: { material: GRAY_STAINED_GLASS_PANE, slots: [0-9, 17-18, 26-27, 35-36, 44-53], display_name: '' }
      poll: { material: '%material%', slots: [10-16, 19-25, 28-34, 37-43] }
      empty: { material: PAPER, slot: 22, display_name: '<white>No polls yet</white>', lore: ['<gray>An administrator can create one with /poll create</gray>'] }
      previous-page: { material: ARROW, slot: 45, display_name: '<white>Previous page</white>' }
      page-info: { material: CLOCK, slot: 49, display_name: '<white>Polls</white>', lore: ['<gray>Page %page% of %pages%</gray>', '<gray>%remaining% awaiting your vote</gray>'] }
      next-page: { material: ARROW, slot: 53, display_name: '<white>Next page</white>' }
  vote:
    menu_title: "<#f72a4c><bold>RIVET</bold></#f72a4c> <dark_gray>•</dark_gray> <white>Vote</white>"
    size: 27
    open_commands: []
    items:
      filler: { material: GRAY_STAINED_GLASS_PANE, slots: 0-26, display_name: '' }
      yes: { material: LIME_CONCRETE, slot: 11, display_name: '<white>Yes</white>', lore: ['<gray>Click to vote Yes</gray>'] }
      poll: { material: PAPER, slot: 13 }
      no: { material: RED_CONCRETE, slot: 15, display_name: '<white>No</white>', lore: ['<gray>Click to vote No</gray>'] }
      back: { material: ARROW, slot: 22, display_name: '<white>Back to polls</white>' }

messages:
  reminder:
    enabled: true
    actions:
      - "[message] <white>You haven't voted on a poll yet. <click:run_command:'/poll'><#f72a4c>Click me to open the poll GUI.</#f72a4c></click></white>"
