# Each portable vanilla interface can be disabled independently.
interfaces:
  craft: true
  anvil: true
  smithing: true
  stonecutter: true
  grindstone: true

jump:
  maximum-range: 50

ride:
  maximum-range: 10
  allow-players: false

# Successful rolls preserve vanilla entity damage but prevent all block grief and drops.
# Chance is a decimal from 0.0 (never) to 1.0 (always).
creeper-confetti:
  enabled: true
  chance: 0.10
  particles:
    count: 96
    spread: 1.5
    size: 1.0
  sound:
    enabled: true
    name: entity.firework_rocket.blast
    volume: 1.0
    pitch: 1.2

list:
  # The count includes only players visible to the viewer.
  output:
    enabled: true
    actions:
      - '[message] <#f72a4c>Online (%count%/%maximum%):</#f72a4c> <#f72a4c>%players%</#f72a4c>'

ping:
  output:
    enabled: true
    actions:
      - "[message] <#f72a4c>%player%'s ping:</#f72a4c> <#f72a4c>%ping% ms</#f72a4c> <white>(%quality%)</white>"

night-vision:
  enabled:
    enabled: true
    actions:
      - '[message] <white>Night vision enabled.</white>'
  disabled:
    enabled: true
    actions:
      - '[message] <white>Night vision disabled.</white>'
