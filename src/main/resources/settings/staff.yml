# Staff command feedback supports MiniMessage.
god:
  # When false, god mode is cleared on logout and plugin shutdown.
  persist-across-reconnects: false

boss-bar:
  default-duration-seconds: 10
  default-color: purple
  # solid, segmented_6, segmented_10, segmented_12, or segmented_20
  default-style: solid

toast:
  default-type: task
  default-icon: paper

same-ip:
  format: "<#f72a4c>Online players sharing <player>'s session address:</#f72a4c> <#f72a4c><matches></#f72a4c>"
  disclaimer: "<white>A shared address does not prove that accounts belong to the same person; proxies and shared networks can affect results.</white>"

notes:
  maximum-length: 500

messages:
  heal: "<white>Healed <#f72a4c><target></#f72a4c>.</white>"
  heal-target: "<white>You were healed by <#f72a4c><player></#f72a4c>.</white>"
  feed: "<white>Fed <#f72a4c><target></#f72a4c>.</white>"
  feed-target: "<white>You were fed by <#f72a4c><player></#f72a4c>.</white>"
  god-enabled: "<white>God mode enabled for <#f72a4c><target></#f72a4c>.</white>"
  god-disabled: "<white>God mode disabled for <#f72a4c><target></#f72a4c>.</white>"
  god-target-enabled: "<white>God mode was enabled.</white>"
  god-target-disabled: "<white>God mode was disabled.</white>"
