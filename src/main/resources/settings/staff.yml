# Staff command feedback supports MiniMessage.
god:
  # When false, god mode is cleared on logout and plugin shutdown.
  persist-across-reconnects: false

boss-bar:
  default-duration-seconds: 10
  default-color: purple
  # solid, segmented_6, segmented_10, segmented_12, or segmented_20
  default-style: solid

toast:
  default-type: task
  default-icon: paper

same-ip:
  format: "<gold>Online players sharing <player>'s session address:</gold> <white><matches></white>"
  disclaimer: "<gray>A shared address does not prove that accounts belong to the same person; proxies and shared networks can affect results.</gray>"

notes:
  maximum-length: 500

messages:
  heal: "<green>Healed <white><target></white>.</green>"
  heal-target: "<green>You were healed by <white><player></white>.</green>"
  feed: "<green>Fed <white><target></white>.</green>"
  feed-target: "<green>You were fed by <white><player></white>.</green>"
  god-enabled: "<green>God mode enabled for <white><target></white>.</green>"
  god-disabled: "<yellow>God mode disabled for <white><target></white>.</yellow>"
  god-target-enabled: "<green>God mode was enabled.</green>"
  god-target-disabled: "<yellow>God mode was disabled.</yellow>"
