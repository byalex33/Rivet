# Staff command feedback supports MiniMessage.
god:
  # When false, god mode is cleared on logout and plugin shutdown.
  persist-across-reconnects: false

boss-bar:
  default-duration-seconds: 10
  default-color: purple
  # solid, segmented_6, segmented_10, segmented_12, or segmented_20
  default-style: solid

toast:
  default-type: task
  default-icon: paper

same-ip:
  format: "<#f72a4c>Online players sharing %player%'s session address:</#f72a4c> <#f72a4c>%matches%</#f72a4c>"
  disclaimer: "<white>A shared address does not prove that accounts belong to the same person; proxies and shared networks can affect results.</white>"

command-spy:
  format: "<#f72a4c>[command spy] %player%:</#f72a4c> <white>%command%</white>"

notes:
  maximum-length: 500

messages:
  tppos-usage: { enabled: true, actions: ['[message] <white>Usage: /tppos &lt;x&gt; &lt;y&gt; &lt;z&gt;</white>'] }
  tppos-invalid: { enabled: true, actions: ['[message] <white>Coordinates must be finite numbers or relative values such as ~10.</white>'] }
  tppos-out-of-world: { enabled: true, actions: ["[message] <white>Those coordinates are outside the world's usable limits.</white>"] }
  tppos-failed: { enabled: true, actions: ['[message] <white>Teleport failed.</white>'] }
  tppos-teleported: { enabled: true, actions: ['[message] <white>Teleported to <#f72a4c>%x%, %y%, %z%</#f72a4c>.</white>'] }
  command-spy-enabled: { enabled: true, actions: ['[message] <white>Command spy enabled.</white>'] }
  command-spy-disabled: { enabled: true, actions: ['[message] <white>Command spy disabled.</white>'] }
  heal: { enabled: true, actions: ['[message] <white>Healed <#f72a4c>%target%</#f72a4c>.</white>'] }
  heal-target: { enabled: true, actions: ['[message] <white>You were healed by <#f72a4c>%player%</#f72a4c>.</white>'] }
  feed: { enabled: true, actions: ['[message] <white>Fed <#f72a4c>%target%</#f72a4c>.</white>'] }
  feed-target: { enabled: true, actions: ['[message] <white>You were fed by <#f72a4c>%player%</#f72a4c>.</white>'] }
  god-enabled: { enabled: true, actions: ['[message] <white>God mode enabled for <#f72a4c>%target%</#f72a4c>.</white>'] }
  god-disabled: { enabled: true, actions: ['[message] <white>God mode disabled for <#f72a4c>%target%</#f72a4c>.</white>'] }
  god-target-enabled: { enabled: true, actions: ['[message] <white>God mode was enabled.</white>'] }
  god-target-disabled: { enabled: true, actions: ['[message] <white>God mode was disabled.</white>'] }
