# Set to 0 to disable automatic AFK detection.
automatic-after-minutes: 10
exclude-from-sleep: true

indicator:
  enabled: true
  format: " <white>[AFK]</white>"

messages:
  afk: "<white><player> is now AFK.</white>"
  afk-with-reason: "<white><player> is now AFK: <#f72a4c><reason></#f72a4c></white>"
  return: "<white><player> is no longer AFK.</white>"
