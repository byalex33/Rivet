# Set to 0 to disable automatic AFK detection.
automatic-after-minutes: 10
exclude-from-sleep: true

indicator:
  enabled: true
  format: " <gray>[AFK]</gray>"

messages:
  afk: "<yellow><player> is now AFK.</yellow>"
  afk-with-reason: "<yellow><player> is now AFK: <white><reason></white></yellow>"
  return: "<green><player> is no longer AFK.</green>"
