# Only listed worlds may be used. Add Nether worlds explicitly if desired.
allowed-worlds:
  - world

minimum-radius: 500
maximum-radius: 5000
maximum-attempts: 24
cooldown-seconds: 300
warmup-seconds: 3
cancel-on-movement: true

# Nether searches stay below the bedrock ceiling.
nether-maximum-y: 120

# Use biome keys such as plains or minecraft:plains. An empty allowlist permits all.
biomes:
  allowlist: []
  denylist:
    - deep_frozen_ocean
    - frozen_ocean

# Optional per-world radius overrides.
worlds:
  world:
    minimum-radius: 500
    maximum-radius: 5000

messages:
  searching: "<white>Searching for a safe location...</white>"
  warmup: "<white>Teleporting in <#f72a4c><seconds></#f72a4c> seconds. Do not move.</white>"
  cancelled: "<white>Random teleport cancelled because you moved.</white>"
  cooldown: "<white>You can use RTP again in <#f72a4c><seconds>s</#f72a4c>."
  success: "<white>Teleported to a safe random location.</white>"
  failed: "<white>Could not find a safe location. Try again later.</white>"
  world-disabled: "<white>Random teleport is unavailable in that world.</white>"
