# Only listed worlds may be used. Add Nether worlds explicitly if desired.
allowed-worlds:
  - world

minimum-radius: 500
maximum-radius: 5000
maximum-attempts: 24
cooldown-seconds: 300

# Nether searches stay below the bedrock ceiling.
nether-maximum-y: 120

# Use biome keys such as plains or minecraft:plains. An empty allowlist permits all.
biomes:
  allowlist: []
  denylist:
    - deep_frozen_ocean
    - frozen_ocean

# Optional per-world radius overrides.
worlds:
  world:
    minimum-radius: 500
    maximum-radius: 5000

messages:
  searching:
    enabled: true
    actions:
      - '[message] <white>Searching for a safe location...</white>'
  cooldown:
    enabled: true
    actions:
      - '[message] <white>You can use RTP again in <#f72a4c>%seconds%s</#f72a4c>.'
  success:
    enabled: true
    actions:
      - '[message] <white>Teleported to a safe random location.</white>'
  failed:
    enabled: true
    actions:
      - '[message] <white>Could not find a safe location. Try again later.</white>'
  world-disabled:
    enabled: true
    actions:
      - '[message] <white>Random teleport is unavailable in that world.</white>'
