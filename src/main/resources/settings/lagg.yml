# Seconds between ground-item cleanups. Items are scanned only when a cleanup runs.
cleanup-interval-seconds: 300

# Warnings must be greater than 0 and shorter than the cleanup interval.
warning-seconds:
  - 60
  - 30
  - 10

# Avoid broadcasting scheduled cleanup results when nothing was eligible.
broadcast-empty-cleanups: false

ignore:
  # Shulker boxes of every colour are always protected from cleanup.
  # Protect dropped items with an entity custom name or an ItemStack custom name.
  custom-names: true
  # Protect dropped items or ItemStacks carrying PersistentDataContainer data.
  persistent-data: true
  # Protect the crop harvests listed below from scheduled and manual cleanup.
  crops: true

# Materials treated as crop drops when ignore.crops is enabled.
crop-materials:
  - WHEAT
  - WHEAT_SEEDS
  - CARROT
  - POTATO
  - POISONOUS_POTATO
  - BEETROOT
  - BEETROOT_SEEDS
  - NETHER_WART
  - COCOA_BEANS
  - MELON
  - MELON_SLICE
  - MELON_SEEDS
  - PUMPKIN
  - PUMPKIN_SEEDS
  - SWEET_BERRIES
  - GLOW_BERRIES
  - TORCHFLOWER
  - TORCHFLOWER_SEEDS
  - PITCHER_PLANT
  - PITCHER_POD
  - SUGAR_CANE
  - CACTUS
  - BAMBOO
  - KELP
  - DRIED_KELP
  - BROWN_MUSHROOM
  - RED_MUSHROOM
  - CHORUS_FRUIT
  - CHORUS_FLOWER

# MiniMessage tags are supported. Available placeholders vary by message:
# warning: %seconds%, %plural%
# cleanup: %amount% (total stack contents), %details% (hover label)
# hover-entry: %item%, %amount%
# timer: %time% (compact duration), %seconds% (raw seconds)
messages:
  warning: { enabled: true, actions: ['[broadcast] <white>Ground items will be cleared in <#f72a4c>%seconds%</#f72a4c> second%plural%.</white>'] }
  cleanup: { enabled: true, actions: ['[broadcast] <white>Cleared <#f72a4c>%amount%</#f72a4c> ground items. %details%</white>'] }
  hover-label: "<#f72a4c>[Hover for more info]</#f72a4c>"
  hover-header: "<#f72a4c><bold>Removed ground items</bold></#f72a4c>"
  hover-entry: "<white>%item%:</white> <#f72a4c>%amount%</#f72a4c> items"
  hover-empty: "<white>No eligible ground items were found.</white>"
  timer: { enabled: true, actions: ['[message] <white>Next ground-item cleanup in <#f72a4c>%time%</#f72a4c>.</white>'] }
  usage: { enabled: true, actions: ['[message] <white>Usage: /lagg <clear|timer></white>'] }
