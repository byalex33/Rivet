# /near only includes visible players in the command sender's current world.
radius: 100
maximum-results: 10
exclude-spectators: true

messages:
  header: "<#f72a4c>Nearby players within <#f72a4c>%radius%</#f72a4c> blocks:</#f72a4c>"
  entry: "<#f72a4c>%player%</#f72a4c> <white>- %distance%m</white>"
  none: "<white>No visible players are within <#f72a4c>%radius%</#f72a4c> blocks.</white>"
