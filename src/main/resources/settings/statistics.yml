# Available placeholders are shown in the defaults below.
header: "<#f72a4c><bold>%player%'s statistics</bold></#f72a4c>"
playtime-format: "<#f72a4c>%player%'s playtime:</#f72a4c> <#f72a4c>%playtime%</#f72a4c>"
seen:
  usage: "<white>Usage: /seen &lt;player&gt;</white>"
  not-found: "<white>That player could not be found.</white>"
  online: "<white><#f72a4c>%player%</#f72a4c> is currently online (joined <#f72a4c>%duration%</#f72a4c> ago).</white>"
  offline: "<white><#f72a4c>%player%</#f72a4c> was last seen <#f72a4c>%duration%</#f72a4c> ago (%timestamp%).</white>"
  date-format: "d MMM uuuu 'at' HH:mm z"
lines:
  - "<white>Playtime:</white> <#f72a4c>%playtime%</#f72a4c>"
  - "<white>Deaths:</white> <#f72a4c>%deaths%</#f72a4c> <#f72a4c>•</#f72a4c> <white>Player kills:</white> <#f72a4c>%player_kills%</#f72a4c>"
  - "<white>Mob kills:</white> <#f72a4c>%mob_kills%</#f72a4c> <#f72a4c>•</#f72a4c> <white>Jumps:</white> <#f72a4c>%jumps%</#f72a4c>"
  - "<white>Blocks broken:</white> <#f72a4c>%blocks_broken%</#f72a4c> <#f72a4c>•</#f72a4c> <white>Placed:</white> <#f72a4c>%blocks_placed%</#f72a4c>"
  - "<white>Distance:</white> <#f72a4c>%distance%</#f72a4c>"
  - "<white>Time since first join:</white> <#f72a4c>%since_first_join%</#f72a4c>"
