# Available placeholders are shown in the defaults below.
statistics:
  enabled: true
  actions:
    - "[message] <#f72a4c><bold>%player%'s statistics</bold></#f72a4c>"
    - '[message] <white>Playtime:</white> <#f72a4c>%playtime%</#f72a4c>'
    - '[message] <white>Deaths:</white> <#f72a4c>%deaths%</#f72a4c> <#f72a4c>•</#f72a4c> <white>Player kills:</white> <#f72a4c>%player_kills%</#f72a4c>'
    - '[message] <white>Mob kills:</white> <#f72a4c>%mob_kills%</#f72a4c> <#f72a4c>•</#f72a4c> <white>Jumps:</white> <#f72a4c>%jumps%</#f72a4c>'
    - '[message] <white>Blocks broken:</white> <#f72a4c>%blocks_broken%</#f72a4c> <#f72a4c>•</#f72a4c> <white>Placed:</white> <#f72a4c>%blocks_placed%</#f72a4c>'
    - '[message] <white>Distance:</white> <#f72a4c>%distance%</#f72a4c>'
    - '[message] <white>Time since first join:</white> <#f72a4c>%since_first_join%</#f72a4c>'
playtime:
  enabled: true
  actions:
    - "[message] <#f72a4c>%player%'s playtime:</#f72a4c> <#f72a4c>%playtime%</#f72a4c>"
seen:
  # Relative time placeholders carry hover text with the exact timestamp.
  usage: { enabled: true, actions: ['[message] <white>%tag% Usage: /seen &lt;player&gt;</white>'] }
  not-found: { enabled: true, actions: ['[message] <white>%tag% That player could not be found.</white>'] }
  online:
    enabled: true
    actions:
      - '[message] %tag% <white><bold>%player%</bold></white> <green><bold>ONLINE</bold></green>'
      - '[message] <gray>Current session:</gray> <white>%session%</white>'
      - '[message] <gray>First joined:</gray> <white>%first_join%</white>'
      - '[message] <gray>Last login:</gray> <white>%last_login%</white>'
      - '[message] <gray>Total playtime:</gray> <white>%playtime%</white>'
  offline:
    enabled: true
    actions:
      - '[message] %tag% <white><bold>%player%</bold></white> <red><bold>OFFLINE</bold></red>'
      - '[message] <gray>Last seen:</gray> <white>%last_logout%</white>'
      - '[message] <gray>First joined:</gray> <white>%first_join%</white>'
      - '[message] <gray>Last login:</gray> <white>%last_login%</white>'
      - '[message] <gray>Total playtime:</gray> <white>%playtime%</white>'
  # These lines are only sent to viewers with rivet.seen.location.
  staff-location: { enabled: true, actions: ['[message] <gray>Location:</gray> <white>%world%</white> <gray>at</gray> <white>%coordinates%</white>'] }
  staff-death: { enabled: true, actions: ['[message] <gray>Last death:</gray> <white>%last_death%</white> <gray>at</gray> <white>%death_location%</white>'] }
  date-format: "d MMM uuuu 'at' HH:mm z"
