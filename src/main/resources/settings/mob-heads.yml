# Chance that a supported mob killed by a player drops its head (0.0 to 1.0).
drop-chance: 0.03

# Extra drop chance added for each Looting level on the killer's held weapon.
looting-bonus-per-level: 0.01

# Wither Skeleton skulls already use Minecraft's vanilla Looting-aware drop logic.
# Keep this false to leave them entirely to vanilla. Enabling it adds Rivet's
# independent configured roll on top of the vanilla chance.
custom-wither-skeleton-drops: false

# Entity types are matched case-insensitively, for example COW or WITHER_SKELETON.
# Head materials are also accepted: ZOMBIE_HEAD blocks zombies and giants, while
# PLAYER_HEAD blocks every mob that uses a custom player-head texture.
disallowed-heads: []

drop-display:
  name: "<#f72a4c><bold>%mob% Head</bold></#f72a4c>"

drop-effects:
  enabled: true
  sound:
    enabled: true
    name: entity.turtle_egg.hatch
    volume: 1.2
    pitch: 0.85
  particles:
    spiral:
      enabled: true
      name: end_rod
      steps: 8
      points-per-step: 16
      period-ticks: 2
      initial-radius: 0.15
      radius-per-step: 0.08
      height-per-step: 0.06
      rotation-per-step: 0.3
      speed: 0.01
    burst:
      enabled: true
      name: totem_of_undying
      count: 8
      offset-x: 0.3
      offset-y: 0.35
      offset-z: 0.3
      speed: 0.08

player-heads:
  display-name: "<#f72a4c>%player%'s Head</#f72a4c>"
  lore:
    - '<dark_gray>│</dark_gray> <gray>Requested by:</gray> <white>%requester%</white>'
