# Saved graves and latest death locations are stored in ../data/graves.yml.
death-message: "<white>You died at <#f72a4c>%x%, %y%, %z%</#f72a4c> in <white>%world%</white>.</white>"

back:
  cooldown-seconds: 30
  messages:
    none: "<white>No death location is saved.</white>"
    cooldown: "<white>You can use /back again in %seconds% seconds.</white>"
    teleported: "<white>Returned to your latest death location.</white>"

ownership:
  # When true, only the owner can initially open a grave.
  owner-only: true
  # 0 means other players are never allowed. Otherwise access opens after this delay.
  allow-others-after-seconds: 0

expiry:
  # 0 means graves never expire. Expired items are dropped only when their world is available.
  seconds: 0
  drop-items: true

tracking-compass:
  enabled: false
  name: "<#f72a4c>Grave Tracker</#f72a4c>"
  lore:
    - "<white>Points to your latest active grave.</white>"
