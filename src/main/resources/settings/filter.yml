# Filters match item materials only; names, lore, enchantments, and other data
# do not create separate entries.
maximum-size: 50
blocked-worlds: []

feedback:
  action-bar: true
  # Optional sound key, for example minecraft:block.note_block.bass. Empty disables it.
  sound: ""

gui:
  title: "<white>Item Filter"
  open_commands: []

messages:
  blocked-pickup: "<white>Pickup blocked: <#f72a4c>%item%</#f72a4c>"
  list: "<#f72a4c>Filtered items:</#f72a4c> <#f72a4c>%items%</#f72a4c>"
