# Filters match item materials only; names, lore, enchantments, and other data
# do not create separate entries. Adding an item automatically enables the filter.
maximum-size: 50
blocked-worlds: []

feedback:
  action-bar: true
  # Optional sound key, for example minecraft:block.note_block.bass. Empty disables it.
  sound: ""

gui:
  # DeluxeMenus-style schema. Slots are zero-based (0-53).
  menu_title: "<#f72a4c><bold>RIVET</bold></#f72a4c> <dark_gray>•</dark_gray> <white>Item Filter</white>"
  size: 54
  open_commands: []
  items:
    filler:
      material: GRAY_STAINED_GLASS_PANE
      slots: [0-9, 17-18, 26-27, 35-36, 44-53]
      display_name: ''
    filtered-item:
      material: '%material%'
      slots: [10-16, 19-25, 28-34, 37-43]
      display_name: '<white>%item%</white>'
      lore:
        - '<gray>This item is blocked from pickup.</gray>'
        - ''
        - '<dark_gray>│</dark_gray> <#f72a4c>Left-click</#f72a4c> <gray>to remove it.</gray>'
    empty:
      material: HOPPER
      slot: 22
      display_name: '<white>No filtered items</white>'
      lore:
        - '<gray>Your pickup filter is currently empty.</gray>'
        - ''
        - '<dark_gray>│ Hold an item and use Add held item below.</dark_gray>'
    previous-page:
      material: ARROW
      slot: 45
      display_name: '<white>Previous page</white>'
    add-held-item:
      material: HOPPER
      slot: 47
      display_name: '<white>Add held item</white>'
      lore:
        - '<gray>Add the item held in your main hand.</gray>'
        - ''
        - '<dark_gray>│</dark_gray> <#f72a4c>Left-click</#f72a4c> <gray>to add the item.</gray>'
    status:
      material: '%material%'
      slot: 49
      display_name: '<white>Filtering %status%</white>'
      lore:
        - '<dark_gray>│</dark_gray> <gray>Page:</gray> <white>%page%/%pages%</white>'
        - '<dark_gray>│</dark_gray> <gray>Slots:</gray> <white>%used%/%maximum%</white>'
        - ''
        - '<dark_gray>│</dark_gray> <#f72a4c>Left-click</#f72a4c> <gray>to toggle filtering.</gray>'
    clear-all:
      material: BARRIER
      slot: 51
      display_name: '<white>Clear all filters</white>'
      lore:
        - '<gray>Remove every item from your filter.</gray>'
        - ''
        - '<dark_gray>│</dark_gray> <red>Shift-click</red> <gray>to confirm.</gray>'
    next-page:
      material: ARROW
      slot: 53
      display_name: '<white>Next page</white>'

messages:
  blocked-pickup:
    enabled: true
    actions:
      - '[actionbar] <white>Pickup blocked: <#f72a4c>%item%</#f72a4c>'
  list:
    enabled: true
    actions:
      - '[message] <#f72a4c>Filtered items:</#f72a4c> <#f72a4c>%items%</#f72a4c>'
