# /invsee and staff ender-chest access support online players only. Offline
# access is intentionally omitted because loading player files behind Paper's
# back is unsafe and can overwrite newer data.

item-editing:
  maximum-name-length: 50
  maximum-lore-line-length: 100
  maximum-lore-lines: 10
  # Material enum names, for example BEDROCK or COMMAND_BLOCK.
  blocked-materials: []

messages:
  repair-invalid: "<white>Hold a damaged repairable item.</white>"
  repair-success: "<white>Repaired the item in your hand.</white>"
  repair-all: "<white>Repaired <#f72a4c><count></#f72a4c> items.</white>"
  empty-hand: "<white>Hold an item first.</white>"
  blocked-item: "<white>That material cannot be edited.</white>"
  rename-success: "<white>Item renamed.</white>"
  rename-cleared: "<white>Item name cleared.</white>"
  lore-success: "<white>Item lore updated.</white>"
  lore-cleared: "<white>Item lore cleared.</white>"
  lore-line-invalid: "<white>That lore line does not exist.</white>"
  hat-success: "<white>Equipped the item as your hat.</white>"
  invalid-text: "<white>Text must be 1-<max> visible characters without control characters.</white>"
