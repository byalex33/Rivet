# /invsee and staff ender-chest access support online players only. Offline
# access is intentionally omitted because loading player files behind Paper's
# back is unsafe and can overwrite newer data.

item-editing:
  maximum-name-length: 50
  maximum-lore-line-length: 100
  maximum-lore-lines: 10
  # Material enum names, for example BEDROCK or COMMAND_BLOCK.
  blocked-materials: []

scan:
  # Caps chat output only; completion totals still include every match.
  maximum-results: 100
  # A small asynchronous pipeline avoids loading the entire map at once.
  concurrent-chunk-loads: 2
  progress-interval-chunks: 500

messages:
  repair-invalid: { enabled: true, actions: ['[message] <white>Hold a damaged repairable item.</white>'] }
  repair-success: { enabled: true, actions: ['[message] <white>Repaired the item in your hand.</white>'] }
  repair-all: { enabled: true, actions: ['[message] <white>Repaired <#f72a4c>%count%</#f72a4c> items.</white>'] }
  empty-hand: { enabled: true, actions: ['[message] <white>Hold an item first.</white>'] }
  blocked-item: { enabled: true, actions: ['[message] <white>That material cannot be edited.</white>'] }
  rename-success: { enabled: true, actions: ['[message] <white>Item renamed.</white>'] }
  rename-cleared: { enabled: true, actions: ['[message] <white>Item name cleared.</white>'] }
  lore-success: { enabled: true, actions: ['[message] <white>Item lore updated.</white>'] }
  lore-cleared: { enabled: true, actions: ['[message] <white>Item lore cleared.</white>'] }
  lore-line-invalid: { enabled: true, actions: ['[message] <white>That lore line does not exist.</white>'] }
  hat-success: { enabled: true, actions: ['[message] <white>Equipped the item as your hat.</white>'] }
  invalid-text: { enabled: true, actions: ['[message] <white>Text must be 1-%max% visible characters without control characters.</white>'] }
