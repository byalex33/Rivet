# Shared policy for player-facing teleports: /home, /warp, /spawn, /back,
# accepted TPA requests, and /rtp. Staff and test-world commands stay immediate.
warmup-seconds: 3
cooldown-seconds: 10
cancel-on-move: true

messages:
  warmup: "<white>Teleporting in <#f72a4c>%seconds%</#f72a4c> seconds. Do not move.</white>"
  cancelled: "<white>Teleport cancelled because you moved.</white>"
  cooldown: "<white>You can teleport again in <#f72a4c>%seconds%</#f72a4c> seconds.</white>"
  failed: "<white>Teleport failed.</white>"
