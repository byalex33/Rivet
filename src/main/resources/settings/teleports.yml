# Shared policy for player-facing teleports: /home, /warp, /spawn, /back,
# accepted TPA requests, and /rtp. Staff and test-world commands stay immediate.
# Operators and players with rivet.tp.nocooldown skip the warmup and every cooldown.
warmup-seconds: 3
cooldown-seconds: 10
cancel-on-move: true

messages:
  warmup: { enabled: true, actions: ['[message] <white>Teleporting in <#f72a4c>%seconds%</#f72a4c> seconds. Do not move.</white>'] }
  cancelled: { enabled: true, actions: ['[message] <white>Teleport cancelled because you moved.</white>'] }
  cooldown: { enabled: true, actions: ['[message] <white>You can teleport again in <#f72a4c>%seconds%</#f72a4c> seconds.</white>'] }
  failed: { enabled: true, actions: ['[message] <white>Teleport failed.</white>'] }
