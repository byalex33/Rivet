    sound:
      enabled: true
      name: block_beacon_power_select
      volume: 0.7
      pitch: 1.5
    particles:
      enabled: true
      spiral-enabled: true
      connection-enabled: true
      first-color: "#FFD166"
      second-color: "#55FFAA"
      dust-size: 0.8
