gui:
  # DeluxeMenus-style schema. Slots are zero-based (0-53).
  menu_title: "<#f72a4c><bold>RIVET</bold></#f72a4c> <dark_gray>•</dark_gray> <white>Trash Bin</white>"
  size: 54
  # GUI actions support:
  # [message] <text>
  # [broadcast] <text>
  # [sound] <sound> [volume] [pitch]
  # [toast] [i:<item>] [type:task|goal|challenge] <text>
  # [actionbar] <text>
  # [particle] <particle> [count]
  # [firework] <#RRGGBB,#RRGGBB> | <type> | <power> | <count> | <gap ticks>
  # [title] <title> | <subtitle> | <fade-in ticks> | <stay ticks> | <fade-out ticks>
  # [bossbar] [-d:seconds] [-c:color] [-s:style] <text>
  # [lightning] (visual only), and [close]
  open_commands:
    - '[sound] block.chest.open'
    - '[message] <white>The trash has been opened.</white>'
  items:
    filler-top:
      material: GRAY_STAINED_GLASS_PANE
      slots: 45-48
      display_name: ''
      lore: []
    close:
      material: BARRIER
      slot: 49
      display_name: '<red><bold>Close Trash</bold></red>'
      lore:
        - '<gray>Anything left in this menu will be destroyed.</gray>'
        - ''
        - '<dark_gray>│</dark_gray> <red>Left-click</red> <gray>to close the trash.</gray>'
      click_commands:
        - '[close]'
    filler-bottom:
      material: GRAY_STAINED_GLASS_PANE
      slots: 50-53
      display_name: ''
      lore: []
