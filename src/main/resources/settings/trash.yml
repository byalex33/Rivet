gui:
  # Inventory rows, from 1 to 6. Slots are numbered from 1.
  rows: 6
  title: "<#f72a4c><bold>RIVET</bold></#f72a4c> <dark_gray>•</dark_gray> <white>Trash Bin</white>"
  # GUI actions support:
  # [message] <text>
  # [broadcast] <text>
  # [sound] <sound> [volume] [pitch]
  # [toast] [i:<item>] [type:task|goal|challenge] <text>
  # [actionbar] <text>
  # [particle] <particle> [count]
  # [firework] <#RRGGBB,#RRGGBB> | <type> | <power> | <count> | <gap ticks>
  # [title] <title> | <subtitle> | <fade-in ticks> | <stay ticks> | <fade-out ticks>
  # [bossbar] [-d:seconds] [-c:color] [-s:style] <text>
  # [lightning] (visual only), and [close]
  open_commands:
    enabled: true
    actions:
      - '[sound] block.chest.open'
      - '[message] <white>The trash has been opened.</white>'
  items:
    'fillerItems1':
      material: GRAY_STAINED_GLASS_PANE
      slots: 46-49
      name: ''
      lore: ''
    'closeMenu':
      material: BARRIER
      slot: 50
      name: '<red><bold>Close Trash</bold></red>'
      lore: '<gray>Items left above are destroyed on close.</gray>'
    'fillerItems2':
      material: GRAY_STAINED_GLASS_PANE
      slots: 51-54
      name: ''
      lore: ''
