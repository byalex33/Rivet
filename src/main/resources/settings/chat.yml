  allow-custom-hex: true
  allow-custom-gradients: true
  allow-rainbow: true

tags:
  enabled: true
  # Each key becomes rivet.chat.tag.<key>.
  list:
    og:
      display: "<gold>[OG]</gold>"
    builder:
      display: "<aqua>[Builder]</aqua>"
    aviation:
      display: "<gradient:#00aaff:#ffffff>[Aviation]</gradient>"

mentions:
  enabled: true
  format: "<yellow>@%player%</yellow>"
  # Leave blank to disable the notification sound.
  sound: BLOCK_NOTE_BLOCK_PLING

anti-spam:
  enabled: true
  cooldown: 1s
  similarity:
    enabled: true
    threshold: 85

# DeluxeMenus-style inventory selectors. Slots are zero-based (0-53).
gui:
  chat-styles:
    menu_title: "<#f72a4c><bold>RIVET</bold></#f72a4c> <dark_gray>•</dark_gray> <white>Chat Styles</white>"
    size: 54
    open_commands: []
    items:
      filler: { material: GRAY_STAINED_GLASS_PANE, slots: [0-9, 17-18, 26-27, 35-36, 44-53], display_name: '' }
      option:
        material: '%material%'
        slots: [10-16, 19-25, 28-34, 37-43]
        display_name: '%display%'
        lore:
          - '<gray>%description%</gray>'
          - ''
          - '<dark_gray>│</dark_gray> <#f72a4c>%status%</#f72a4c>'
      previous-page:
        material: ARROW
        slot: 45
        display_name: '<white>Previous page</white>'
        lore:
          - '<dark_gray>│</dark_gray> <#f72a4c>Left-click</#f72a4c> <gray>to view earlier choices.</gray>'
      page-info:
        material: BOOK
        slot: 49
        display_name: '<white>Page %page% of %pages%</white>'
        lore:
          - '<dark_gray>│</dark_gray> <gray>Choices:</gray> <white>%count%</white>'
          - '<dark_gray>│</dark_gray> <gray>Current:</gray> <white>%current%</white>'
      reset:
        material: MILK_BUCKET
        slot: 50
        display_name: '<white>Reset to default</white>'
        lore:
          - '<dark_gray>│</dark_gray> <#f72a4c>Left-click</#f72a4c> <gray>to clear your selection.</gray>'
      next-page:
        material: ARROW
        slot: 53
        display_name: '<white>Next page</white>'
        lore:
          - '<dark_gray>│</dark_gray> <#f72a4c>Left-click</#f72a4c> <gray>to view more choices.</gray>'
  chat-tags:
    menu_title: "<#f72a4c><bold>RIVET</bold></#f72a4c> <dark_gray>•</dark_gray> <white>Chat Tags</white>"
    size: 54
    open_commands: []
    items:
      filler: { material: GRAY_STAINED_GLASS_PANE, slots: [0-9, 17-18, 26-27, 35-36, 44-53], display_name: '' }
      option:
        material: '%material%'
        slots: [10-16, 19-25, 28-34, 37-43]
        display_name: '%display%'
        lore:
          - '<gray>%description%</gray>'
          - ''
          - '<dark_gray>│</dark_gray> <#f72a4c>%status%</#f72a4c>'
      previous-page:
        material: ARROW
        slot: 45
        display_name: '<white>Previous page</white>'
        lore:
          - '<dark_gray>│</dark_gray> <#f72a4c>Left-click</#f72a4c> <gray>to view earlier choices.</gray>'
      page-info:
        material: BOOK
        slot: 49
        display_name: '<white>Page %page% of %pages%</white>'
        lore:
          - '<dark_gray>│</dark_gray> <gray>Choices:</gray> <white>%count%</white>'
          - '<dark_gray>│</dark_gray> <gray>Current:</gray> <white>%current%</white>'
      reset:
        material: BARRIER
        slot: 50
        display_name: '<white>Remove chat tag</white>'
        lore:
          - '<dark_gray>│</dark_gray> <red>Left-click</red> <gray>to remove your chat tag.</gray>'
      next-page:
        material: ARROW
        slot: 53
        display_name: '<white>Next page</white>'
        lore:
          - '<dark_gray>│</dark_gray> <#f72a4c>Left-click</#f72a4c> <gray>to view more choices.</gray>'

social-spy:
  format: "<#f72a4c>[spy] %sender% → %recipient%:</#f72a4c> <white>%message%</white>"
  messages:
    enabled: { enabled: true, actions: ['[message] <white>Social spy enabled.</white>'] }
    disabled: { enabled: true, actions: ['[message] <white>Social spy disabled.</white>'] }

ignore:
  messages:
    added: { enabled: true, actions: ['[message] <white>You now ignore <#f72a4c>%player%</#f72a4c>.'] }
    removed: { enabled: true, actions: ['[message] <white>You no longer ignore <#f72a4c>%player%</#f72a4c>.'] }
    list: { enabled: true, actions: ['[message] <#f72a4c>Ignored players:</#f72a4c> <#f72a4c>%players%</#f72a4c>'] }
    cleared: { enabled: true, actions: ['[message] <white>Your ignore list was cleared.</white>'] }
    self: { enabled: true, actions: ['[message] <white>You cannot ignore yourself.</white>'] }
    blocked: { enabled: true, actions: ['[message] <white>That private message could not be delivered.</white>'] }
