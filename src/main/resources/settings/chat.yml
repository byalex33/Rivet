# The placeholders are inserted as safe components; a player's style affects %message% only.
# %prefix% and %suffix% use Rivet group metadata when the optional permissions module is enabled.
format: "%head% %prefix%%tag% %player%%suffix%<dark_gray>: </dark_gray>%message%"
me:
  # %player% and %message% are safe component placeholders.
  format: "<#f72a4c>* %player%</#f72a4c> <white>%message%</white>"
private-messages:
  sent: "<#f72a4c>[you → %player%]</#f72a4c> <white>%message%</white>"
  received: "<#f72a4c>[%player% → you]</#f72a4c> <white>%message%</white>"

chat-styles:
  # Each key becomes rivet.chat.color.<key> or rivet.chat.gradient.<key>.
  colors:
    red: "<red>"
    gold: "<gold>"
    aqua: "<aqua>"
    pink: "<#ff5f91>"
  gradients:
    sunset: "<gradient:#ff512f:#f09819>"
    ocean: "<gradient:#2193b0:#6dd5ed>"
    fire: "<gradient:#ff0000:#ffaa00>"
    # Popular community presets from https://www.birdflop.com/resources/rgb/presets/
    # are prefixed so they remain easy to identify and override.
    birdflop-pastel-rainbow: "<gradient:#EC8C8C:#FFC58B:#FFFF9E:#9AFF9A:#97CFF5:#A39AFF:#EEA0FF>"
    birdflop-holographic: "<gradient:#fdcdcd:#dec0fc:#cec0fc:#aec0fc:#94e1ea>"
    birdflop-tropical-mango: "<gradient:#FF7272:#FFC976>"
    birdflop-mango: "<gradient:#FFE259:#FFA751>"
    birdflop-redstone-dust: "<gradient:#950502:#370303>"
    birdflop-soft-rainbow: "<gradient:#FF4B4B:#FF8B2D:#FFD031:#DCFF39:#6DFF45:#3BFFC7:#58D0FF:#5489FF>"
    birdflop-gold: "<gradient:#FEBA17:#FFF085>"
    birdflop-amethyst: "<gradient:#a18cd1:#fbc2eb>"
    birdflop-desires: "<gradient:#680000:#FF0000:#5B0000:#FF0000:#B60000>"
    birdflop-rainbow: "<gradient:#FF0000:#FF7F00:#FFFF00:#00FF00:#0000FF:#4B0082:#9400D3>"
    birdflop-google: "<gradient:#4385f5:#eb4235:#f9bc04:#4385f5:#34a853:#eb4235>"
    birdflop-glitchy: "<gradient:#9F00FF:#000000:#B300FF:#000000>"
    birdflop-deep-ocean: "<gradient:#13547a:#80d0c7>"
    birdflop-elyurias: "<gradient:#F97E9C:#F9F9F9>"
    birdflop-simply-terraria: "<gradient:#62B071:#CDA785>"
    birdflop-dragonfruit: "<gradient:#FFBABA:#E12B5D>"
    birdflop-warden: "<gradient:#005155:#448367:#00566B>"
    birdflop-silver: "<gradient:#969696:#FFFFFF>"
    birdflop-scorpion: "<gradient:#000000:#A58787:#7A6868:#410101:#290909:#000000:#A58787>"
    birdflop-northern-lights: "<gradient:#68f589:#ac6fff>"
    birdflop-sky-blurple: "<gradient:#91D7FF:#C75AFF>"
    birdflop-summertime: "<gradient:#8EFFFF:#FFC3CF:#EB8291:#FFC97F>"
    birdflop-zenith: "<gradient:#00FFCC:#26FFB2:#4DFF99:#73FF80:#99FF66:#BFFF4D>"
    birdflop-vice-city: "<gradient:#3494E6:#EC6EAD>"
    birdflop-rose: "<gradient:#F4C4F3:#FC67FA>"
    birdflop-valentine: "<gradient:#d60000:#ff2644:#ff257e:#ffc5e6:#ffffff>"
    birdflop-frost: "<gradient:#61C6EE:#A3DEFF:#61C6EE>"
    birdflop-desert-breeze: "<gradient:#FFE4D5:#FFD3BA:#FFCEB4:#FFB5A3:#DFAA9E:#FFB4A2:#DF9FA2:#C38587:#A1686A>"
