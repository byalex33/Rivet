# Kits use simple item maps. Optional fields: amount, name, lore, enchantments.
# Armour and offhand items are moved into the player's inventory before being replaced.
kits:
  starter:
    cooldown-seconds: 86400
    items:
      - material: STONE_SWORD
      - material: STONE_PICKAXE
      - material: BREAD
        amount: 16
    armor:
      helmet:
        material: LEATHER_HELMET
      chestplate:
        material: LEATHER_CHESTPLATE
      leggings:
        material: LEATHER_LEGGINGS
      boots:
        material: LEATHER_BOOTS
    offhand:
      material: TORCH
      amount: 16

messages:
  list: "<#f72a4c>Available kits:</#f72a4c> <#f72a4c><kits></#f72a4c>"
  unknown: "<white>That kit does not exist.</white>"
  no-permission: "<white>You cannot use the <#f72a4c><kit></#f72a4c> kit.</white>"
  cooldown: "<white>Kit <#f72a4c><kit></#f72a4c> is available in <seconds> seconds.</white>"
  received: "<white>Received kit <#f72a4c><kit></#f72a4c>.</white>"
