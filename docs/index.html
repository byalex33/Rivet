<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rivet Paper plugin documentation">
  <title>Rivet documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Loading documentation...</div>
  <script>
    window.$docsify = {
      name: 'Rivet',
      repo: 'https://github.com/byalex33/Rivet',
      homepage: 'README.md',
      loadSidebar: true,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 0,
      relativePath: true,
      search: {
        placeholder: 'Search documentation',
        noData: 'No matching documentation found',
        depth: 3
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
